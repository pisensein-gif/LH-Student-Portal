<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Attendance Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand">LH Hostel Admin</div>
        <div>
            <button class="btn-secondary" onclick="window.location.href='admin.html'">Back to Dashboard</button>
            <button class="btn-secondary" onclick="logout()">Logout</button>
        </div>
    </header>
    
    <main class="portal-content">
        <div class="card">
            <h2>Download Attendance Report</h2>
            <p>Select a date range to generate a CSV report. Total Present days are calculated mathematically based on the selected period minus the number of mess out days.</p>
            
            <form id="report-form" onsubmit="downloadAttendanceCSV(event)">
                <div class="input-group">
                    <label for="report-from">From Date</label>
                    <input type="date" id="report-from" required>
                </div>
                <div class="input-group">
                    <label for="report-to">To Date</label>
                    <input type="date" id="report-to" required>
                </div>
                <button type="submit" class="btn-primary">Download CSV</button>
            </form>
        </div>
    </main>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
    <script>
        if (localStorage.getItem('loggedInUserType') !== 'admin') {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
